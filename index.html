<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Blackwake</title>
<style>
  html, body { margin: 0; padding: 0; background: #07051A; overflow: hidden; height: 100%; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
"use strict";
// BLACKWAKE — La Lame de l'Ombre (version web)
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const PI2 = Math.PI * 2;
const rand = Math.random;
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const FONT = '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Arial Black", "Helvetica Neue", sans-serif';

function seeded(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function rgba(r, g, b, a) { return `rgba(${r},${g},${b},${a})`; }

const S = { TITLE: 0, PLAYING: 1, GAMEOVER: 2 };
const K = { WISP: 0, ONI: 1, KITSUNE: 2, TALISMAN: 3, RAMEN: 4, BOSS: 5 };

let state = S.TITLE;
let best = 0;
try { best = parseInt(localStorage.getItem("blackwake_best") || "0", 10) || 0; } catch (e) {}
let newRecord = false;

let vw = 1, vh = 1, u = 1, groundY = 0, dpr = 1, bg = null;
let enemies = [], particles = [], popups = [], petals = [], trail = [];
let score = 0, lives = 3, combo = 0, maxCombo = 0, comboTimer = 0, gauge = 0;
let elapsed = 0, spawnTimer = 0, nextBoss = 1500, bossCount = 0, bossesBeaten = 0;
let awakenT = 0, speedT = 0, flashT = 0, flashColor = "#fff", shake = 0, heroHurt = 0;
let globalT = 0, stateT = 0;
let touching = false, lastX = 0, lastY = 0, lastTs = 0;
const maxLives = 5;

const killWords = ["斬!", "ズバッ!", "SLASH!", "ザン!", "シュッ!", "一閃!"];
const hypeWords = ["SUGOI!", "YABAI!!", "KAKKOII!", "すごい!", "やばい!", "SUBARASHII!", "MUTEKI!!", "最強!"];

// ================= Taille & décor =================
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  u = Math.min(vw, vh) / 100;
  groundY = vh * 0.80;
  buildBackground();
  petals = [];
  for (let i = 0; i < 36; i++) petals.push({
    x: rand() * vw, y: rand() * vh, vx: -(1 + rand() * 3) * u, vy: (4 + rand() * 6) * u,
    rot: rand() * PI2, vr: (rand() - 0.5) * 3.5, size: (0.6 + rand() * 0.8) * u
  });
}

function ropeY(x) {
  const t = clamp((x + 2 * u) / (vw + 4 * u), 0, 1);
  const a = groundY - u, c = groundY + 2.2 * u;
  return (1 - t) * (1 - t) * a + 2 * (1 - t) * t * c + t * t * a;
}

function buildBackground() {
  const b = document.createElement("canvas");
  b.width = cv.width; b.height = cv.height;
  const c = b.getContext("2d");
  c.scale(dpr, dpr);
  let g = c.createLinearGradient(0, 0, 0, vh);
  g.addColorStop(0, "#07051A"); g.addColorStop(0.45, "#1B0F3D"); g.addColorStop(0.72, "#4A1442"); g.addColorStop(0.9, "#8A2340");
  c.fillStyle = g; c.fillRect(0, 0, vw, vh);

  const r = seeded(7);
  for (let i = 0; i < 160; i++) {
    c.fillStyle = rgba(255, 240, 255, (60 + r() * 170) / 255);
    c.beginPath(); c.arc(r() * vw, r() * vh * 0.6, (0.1 + r() * 0.35) * u, 0, PI2); c.fill();
  }

  const mx = vw * 0.74, my = vh * 0.16, mr = 13 * u;
  g = c.createRadialGradient(mx, my, 0, mx, my, mr * 3.4);
  g.addColorStop(0, "rgba(255,199,221,0.4)"); g.addColorStop(1, "rgba(255,199,221,0)");
  c.fillStyle = g; c.beginPath(); c.arc(mx, my, mr * 3.4, 0, PI2); c.fill();
  c.fillStyle = "#FFF1F5"; c.beginPath(); c.arc(mx, my, mr, 0, PI2); c.fill();
  c.fillStyle = "rgba(199,122,156,0.2)";
  [[-0.35, 0.2, 0.22], [0.3, -0.3, 0.14], [0.15, 0.45, 0.1]].forEach(([dx, dy, rr]) => {
    c.beginPath(); c.arc(mx + mr * dx, my + mr * dy, mr * rr, 0, PI2); c.fill();
  });

  function mountains(baseY, amp, color, seed) {
    const r2 = seeded(seed);
    c.beginPath(); c.moveTo(0, vh); c.lineTo(0, baseY);
    let x = 0;
    while (x < vw + 20 * u) {
      const peak = baseY - amp * (0.4 + r2() * 0.6);
      const w = (10 + r2() * 14) * u;
      c.lineTo(x + w / 2, peak); c.lineTo(x + w, baseY - r2() * amp * 0.2);
      x += w;
    }
    c.lineTo(vw, vh); c.closePath(); c.fillStyle = color; c.fill();
  }
  mountains(vh * 0.64, 16 * u, "#2A1240", 3);
  mountains(vh * 0.73, 10 * u, "#180A28", 11);

  c.fillStyle = "#0A0614"; c.fillRect(0, vh * 0.86, vw, vh * 0.14);

  // torii
  const tx = vw * 0.17, tb = vh * 0.86, th = 24 * u, tw = 18 * u;
  c.fillStyle = "#3E0C1C";
  c.fillRect(tx - tw * 0.38, tb - th, tw * 0.1, th);
  c.fillRect(tx + tw * 0.28, tb - th, tw * 0.1, th);
  c.fillRect(tx - tw * 0.45, tb - th * 0.78, tw * 0.9, th * 0.06);
  c.beginPath();
  c.moveTo(tx - tw * 0.62, tb - th * 1.06);
  c.quadraticCurveTo(tx, tb - th * 0.9, tx + tw * 0.62, tb - th * 1.06);
  c.lineTo(tx + tw * 0.56, tb - th * 0.94);
  c.quadraticCurveTo(tx, tb - th * 0.82, tx - tw * 0.56, tb - th * 0.94);
  c.closePath(); c.fill();
  c.fillRect(tx - tw * 0.05, tb - th * 0.94, tw * 0.1, th * 0.16);

  // lanternes
  for (let i = 0; i < 2; i++) {
    const lx = vw * (0.82 + i * 0.1), ly = vh * 0.84;
    g = c.createRadialGradient(lx, ly - 4 * u, 0, lx, ly - 4 * u, 6 * u);
    g.addColorStop(0, "rgba(255,154,60,0.53)"); g.addColorStop(1, "rgba(255,154,60,0)");
    c.fillStyle = g; c.beginPath(); c.arc(lx, ly - 4 * u, 6 * u, 0, PI2); c.fill();
    c.fillStyle = "#1A0E10"; c.fillRect(lx - 0.5 * u, ly - 2 * u, u, vh * 0.86 - ly + 2 * u);
    c.fillStyle = "#FF8A3C"; roundRect(c, lx - 1.6 * u, ly - 6 * u, 3.2 * u, 4 * u, u); c.fill();
  }

  // corde sacrée (shimenawa)
  c.lineCap = "round";
  const rope = () => { c.beginPath(); c.moveTo(-2 * u, groundY - u); c.quadraticCurveTo(vw / 2, groundY + 2.2 * u, vw + 2 * u, groundY - u); };
  rope(); c.strokeStyle = "rgba(255,85,119,0.33)"; c.lineWidth = 4 * u; c.stroke();
  rope(); c.strokeStyle = "#C9A66B"; c.lineWidth = 1.8 * u; c.stroke();
  c.strokeStyle = "#7A5A30"; c.lineWidth = 0.35 * u;
  for (let rx = 0; rx < vw; rx += 2.2 * u) {
    const ry = ropeY(rx);
    c.beginPath(); c.moveTo(rx - 0.6 * u, ry - 0.8 * u); c.lineTo(rx + 0.6 * u, ry + 0.8 * u); c.stroke();
  }
  c.fillStyle = "#F7F3EA";
  for (let sx = 9 * u; sx < vw; sx += 18 * u) {
    const sy = ropeY(sx), zw = 1.6 * u;
    c.beginPath();
    c.moveTo(sx - zw / 2, sy); c.lineTo(sx + zw / 2, sy);
    c.lineTo(sx + zw / 2, sy + 2 * u); c.lineTo(sx + zw * 1.2, sy + 2 * u);
    c.lineTo(sx + zw * 1.2, sy + 4 * u); c.lineTo(sx + zw * 0.1, sy + 4 * u);
    c.lineTo(sx + zw * 0.1, sy + 6 * u); c.lineTo(sx - zw * 0.9, sy + 6 * u);
    c.lineTo(sx - zw * 0.9, sy + 4 * u); c.lineTo(sx - zw / 2, sy + 4 * u);
    c.closePath(); c.fill();
  }
  bg = b;
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) { c.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); return; }
  r = Math.min(r, w / 2, h / 2);
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// ================= Jeu =================
function startGame() {
  enemies = []; particles = []; popups = []; trail = [];
  score = 0; lives = 3; combo = 0; maxCombo = 0; comboTimer = 0;
  gauge = 0; elapsed = 0; spawnTimer = 1;
  nextBoss = 1500; bossCount = 0; bossesBeaten = 0;
  awakenT = 0; speedT = 0; flashT = 0; shake = 0; heroHurt = 0;
  newRecord = false;
  state = S.PLAYING; stateT = 0;
  addPopup("始め!", vw / 2, vh * 0.42, 1.4, "#FFE14D", 16 * u, false);
  addPopup("HAJIME !", vw / 2, vh * 0.49, 1.4, "#fff", 7 * u, false);
}

function addPopup(text, x, y, life, color, size, rise = true) {
  popups.push({ text, x, y, life, maxLife: life, color, size, rise });
}

function makeEnemy(kind, x, y, vy, r, hp) {
  return { kind, x, y, vy, r, hp, maxHp: hp, baseX: x, phase: rand() * 6.28, t: 0, hitCd: 0, flash: 0, summonT: 2, dead: false };
}

function update(dt) {
  globalT += dt; stateT += dt;

  for (const p of petals) {
    p.x += (p.vx + Math.sin(globalT * 1.3 + p.size) * 2 * u) * dt;
    p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > vh + 2 * u) { p.y = -2 * u; p.x = rand() * vw; }
    if (p.x < -3 * u) p.x = vw + 2 * u;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    const drag = 1 - 2.5 * dt;
    q.vx *= drag; q.vy = q.vy * drag + 25 * u * dt;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const q = popups[i];
    q.life -= dt;
    if (q.life <= 0) popups.splice(i, 1); else if (q.rise) q.y -= 6 * u * dt;
  }
  for (const t of trail) t.age += dt;
  trail = trail.filter(t => t.age <= 0.16);

  flashT = Math.max(0, flashT - dt);
  shake = Math.max(0, shake - dt * 8 * u);
  heroHurt = Math.max(0, heroHurt - dt);
  speedT = Math.max(0, speedT - dt);

  if (state !== S.PLAYING) return;

  awakenT = Math.max(0, awakenT - dt);
  const gdt = dt * (awakenT > 0 ? 0.55 : 1);
  elapsed += gdt;

  if (combo > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

  const boss = enemies.find(e => e.kind === K.BOSS && !e.dead);
  if (!boss && score >= nextBoss) spawnBoss();

  const d = 1 + elapsed / 45;
  spawnTimer -= gdt;
  if (spawnTimer <= 0) {
    spawnTimer = Math.max(0.32, 1.25 / Math.pow(d, 0.7)) * (boss ? 2.2 : 1);
    spawnRandom(d);
    if (d > 1.8 && rand() < 0.25) spawnRandom(d);
  }

  const n = enemies.length;
  for (let i = 0; i < n; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    e.t += gdt; e.hitCd -= gdt; e.flash -= gdt;
    switch (e.kind) {
      case K.WISP: e.y += e.vy * gdt; e.x = e.baseX + Math.sin(e.t * 2 + e.phase) * 3 * u; break;
      case K.ONI: e.y += e.vy * gdt; break;
      case K.KITSUNE: e.y += e.vy * gdt; e.x = e.baseX + Math.sin(e.t * 2.6 + e.phase) * 12 * u; break;
      case K.TALISMAN: case K.RAMEN: e.y += e.vy * gdt; e.x = e.baseX + Math.sin(e.t * 1.5 + e.phase) * 5 * u; break;
      case K.BOSS: {
        const target = vh * 0.24;
        if (e.y < target) e.y += 18 * u * gdt;
        e.x = vw / 2 + Math.sin(e.t * 0.7) * (vw / 2 - e.r - 4 * u);
        e.summonT -= gdt;
        if (e.summonT <= 0 && e.y >= target - u) {
          e.summonT = Math.max(1.0, 2.6 - 0.25 * bossCount);
          enemies.push(makeEnemy(K.WISP, e.x, e.y + e.r, (26 + 4 * bossCount) * u, 4.2 * u, 1));
          burst(e.x, e.y + e.r, "#B45CFF", 10, 20 * u);
        }
        break;
      }
    }
    const harmful = e.kind === K.WISP || e.kind === K.ONI || e.kind === K.KITSUNE;
    if (harmful && e.y >= groundY) {
      e.dead = true;
      burst(e.x, groundY, "#FF3355", 22, 40 * u);
      loseLife("Aïe !");
      if (state !== S.PLAYING) return;
    } else if (!harmful && e.kind !== K.BOSS && e.y - e.r * 2 > vh) {
      e.dead = true;
    }
  }
  enemies = enemies.filter(e => !e.dead);
}

function spawnRandom(d) {
  const roll = rand();
  const tal = Math.min(0.18, 0.05 + 0.03 * (d - 1));
  const ramen = lives < maxLives ? 0.03 : 0;
  let kind;
  if (roll < tal) kind = K.TALISMAN;
  else if (roll < tal + ramen) kind = K.RAMEN;
  else if (elapsed > 15 && roll < tal + ramen + 0.2) kind = K.ONI;
  else if (elapsed > 25 && roll < tal + ramen + 0.38) kind = K.KITSUNE;
  else kind = K.WISP;
  const speed = (22 + 6 * (d - 1)) * u;
  const cfg = {
    [K.WISP]: [4.2, 1, 1], [K.ONI]: [6.2, 2, 0.7], [K.KITSUNE]: [5, 1, 0.9],
    [K.TALISMAN]: [4.5, 1, 1], [K.RAMEN]: [4.5, 1, 1.1]
  }[kind];
  const r = cfg[0] * u;
  const margin = r + 4 * u + (kind === K.KITSUNE ? 12 * u : 0);
  const x = margin + rand() * Math.max(1, vw - 2 * margin);
  enemies.push(makeEnemy(kind, x, -r * 2, speed * cfg[2], r, cfg[1]));
}

function spawnBoss() {
  bossCount++;
  enemies.push(makeEnemy(K.BOSS, vw / 2, -16 * u, 0, 14 * u, 12 + 6 * (bossCount - 1)));
  flashT = 0.4; flashColor = "#FF2244"; shake = 2 * u;
  addPopup("⚠ 警告 ⚠", vw / 2, vh * 0.42, 2.2, "#FF3355", 12 * u, false);
  addPopup("UN GRAND ONI APPROCHE !", vw / 2, vh * 0.48, 2.2, "#fff", 5.5 * u, false);
}

// ================= Entrées =================
function awakenBtn() { return { x: vw - 13 * u, y: vh - 14 * u - safeB }; }

function pointerDown(x, y) {
  if (state === S.TITLE) { if (stateT > 0.4) startGame(); return; }
  if (state === S.GAMEOVER) { if (stateT > 1.2) startGame(); return; }
  const b = awakenBtn();
  if (gauge >= 100 && Math.hypot(x - b.x, y - b.y) < 12 * u) { awaken(); return; }
  touching = true; lastX = x; lastY = y;
  trail = [{ x, y, age: 0 }];
}
function pointerMove(x, y) {
  if (state !== S.PLAYING || !touching) return;
  const len = Math.hypot(x - lastX, y - lastY);
  if (len < 0.3 * u) return;
  if (len > 0.8 * u) slashSegment(lastX, lastY, x, y);
  trail.push({ x, y, age: 0 });
  if (trail.length > 40) trail.shift();
  lastX = x; lastY = y;
}
function pointerUp() { touching = false; }

cv.addEventListener("touchstart", ev => { ev.preventDefault(); const t = ev.changedTouches[0]; pointerDown(t.clientX, t.clientY); }, { passive: false });
cv.addEventListener("touchmove", ev => { ev.preventDefault(); const t = ev.changedTouches[0]; pointerMove(t.clientX, t.clientY); }, { passive: false });
cv.addEventListener("touchend", ev => { ev.preventDefault(); pointerUp(); }, { passive: false });
cv.addEventListener("touchcancel", pointerUp);
let mouseDown = false;
cv.addEventListener("mousedown", ev => { mouseDown = true; pointerDown(ev.clientX, ev.clientY); });
window.addEventListener("mousemove", ev => { if (mouseDown) pointerMove(ev.clientX, ev.clientY); });
window.addEventListener("mouseup", () => { mouseDown = false; pointerUp(); });

function segDist(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 === 0 ? 0 : clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return Math.hypot(ax + t * dx - px, ay + t * dy - py);
}

function slashSegment(ax, ay, bx, by) {
  const n = enemies.length;
  for (let i = 0; i < n; i++) {
    const e = enemies[i];
    if (e.dead || e.hitCd > 0) continue;
    if (segDist(ax, ay, bx, by, e.x, e.y) <= e.r * 1.1) hit(e, bx - ax, by - ay);
    if (state !== S.PLAYING) return;
  }
}

function hit(e, dx, dy) {
  if (e.kind === K.TALISMAN) {
    e.dead = true;
    burst(e.x, e.y, "#9B1BFF", 30, 45 * u); burst(e.x, e.y, "#FF2244", 20, 35 * u);
    loseLife("呪い! Maudit !");
  } else if (e.kind === K.RAMEN) {
    e.dead = true;
    lives = Math.min(maxLives, lives + 1);
    burst(e.x, e.y, "#FFD54A", 26, 35 * u);
    addPopup("ラーメン!", e.x, e.y - 3 * u, 1.1, "#FFD54A", 6 * u);
    addPopup("+1 ♥", e.x, e.y + 4 * u, 1.1, "#FF6F91", 5 * u);
  } else {
    e.hp -= awakenT > 0 ? 2 : 1;
    e.flash = 0.12;
    e.hitCd = e.kind === K.BOSS ? 0.09 : 0.12;
    sparks(e.x, e.y, dx, dy);
    if (e.hp <= 0) kill(e);
    else { score += 10; if (e.kind === K.BOSS) shake = Math.max(shake, 0.8 * u); }
  }
}

function kill(e, fromAwaken = false) {
  e.dead = true;
  combo++; maxCombo = Math.max(maxCombo, combo); comboTimer = 1.3;
  const mult = Math.min(1 + Math.floor(combo / 5), 10);
  const base = { [K.WISP]: 10, [K.ONI]: 25, [K.KITSUNE]: 20, [K.BOSS]: 500 * bossCount }[e.kind] || 0;
  score += base * mult;
  if (!fromAwaken) gauge = Math.min(100, gauge + ({ [K.WISP]: 4, [K.ONI]: 8, [K.KITSUNE]: 6 }[e.kind] || 0));
  const col = { [K.WISP]: "#6FE8FF", [K.ONI]: "#FF4057", [K.KITSUNE]: "#FFA040" }[e.kind] || "#B45CFF";
  if (e.kind === K.BOSS) {
    burst(e.x, e.y, col, 80, 90 * u); burst(e.x, e.y, "#FFE14D", 50, 70 * u);
    flashT = 0.5; flashColor = "#fff"; shake = 3 * u; speedT = 1.2;
    addPopup("撃破!!", vw / 2, vh * 0.4, 2, "#FFE14D", 16 * u, false);
    addPopup(`GRAND ONI VAINCU  +${base * mult}`, vw / 2, vh * 0.47, 2, "#fff", 5 * u, false);
    nextBoss = score + 2000 + 600 * bossCount;
    bossesBeaten++;
    lives = Math.min(maxLives, lives + 1);
  } else {
    burst(e.x, e.y, col, 18, 38 * u);
    addPopup(pick(killWords), clamp(e.x, 12 * u, vw - 12 * u), e.y, 0.7, "#fff", 6 * u);
  }
  if (combo % 10 === 0) {
    speedT = 0.7;
    addPopup(pick(hypeWords), vw / 2, vh * 0.33, 1.1, "#FF6FD8", 11 * u, false);
    addPopup(`${combo} COMBO`, vw / 2, vh * 0.38, 1.1, "#fff", 5 * u, false);
  }
}

function awaken() {
  gauge = 0; awakenT = 5; flashT = 0.7; flashColor = "#fff"; speedT = 1.4; shake = 2.5 * u; touching = false;
  addPopup("覚醒!!", vw / 2, vh * 0.42, 1.8, "#FFE14D", 22 * u, false);
  addPopup("ÉVEIL DE L'OMBRE", vw / 2, vh * 0.5, 1.8, "#fff", 6 * u, false);
  const n = enemies.length;
  for (let i = 0; i < n; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    if (e.kind === K.WISP || e.kind === K.ONI || e.kind === K.KITSUNE) kill(e, true);
    else if (e.kind === K.TALISMAN) { e.dead = true; burst(e.x, e.y, "#B45CFF", 14, 30 * u); }
    else if (e.kind === K.BOSS) {
      e.hp -= 6; e.flash = 0.3;
      burst(e.x, e.y, "#FFE14D", 30, 60 * u);
      if (e.hp <= 0) kill(e, true);
    }
  }
  gauge = 0;
}

function loseLife(text) {
  lives--; combo = 0; heroHurt = 0.6; shake = 2 * u;
  flashT = 0.3; flashColor = "#FF1133";
  if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
  addPopup(text, vw / 2, groundY - 6 * u, 1, "#FF4466", 6 * u);
  if (lives <= 0) gameOver();
}

function gameOver() {
  state = S.GAMEOVER; stateT = 0; touching = false;
  for (const e of enemies) burst(e.x, e.y, "#9B1BFF", 8, 25 * u);
  enemies = [];
  burst(vw / 2, vh * 0.88, "#FF2244", 60, 60 * u);
  if (score > best) {
    best = score; newRecord = true;
    try { localStorage.setItem("blackwake_best", String(best)); } catch (e) {}
  }
}

function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand() * PI2, s = speed * (0.3 + rand()), life = 0.4 + rand() * 0.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, maxLife: life, color, size: (0.4 + rand() * 0.8) * u });
  }
}
function sparks(x, y, dx, dy) {
  const len = Math.max(0.001, Math.hypot(dx, dy)), nx = dx / len, ny = dy / len;
  for (let i = 0; i < 10; i++) {
    const s = (30 + rand() * 50) * u, sp = (rand() - 0.5) * 0.8;
    particles.push({ x, y, vx: (nx - ny * sp) * s, vy: (ny + nx * sp) * s, life: 0.3, maxLife: 0.3, color: "#fff", size: 0.45 * u });
  }
}

// ================= Rendu =================
function txt(s, x, y, size, color, align = "center", alpha = 1, outline = true) {
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.font = `900 ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  if (outline) {
    ctx.lineJoin = "round"; ctx.lineWidth = size * 0.17; ctx.strokeStyle = "#0B0614";
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.globalAlpha = 1;
}
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, PI2); ctx.fill(); }
function line(x1, y1, x2, y2, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function poly(pts, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((rand() - 0.5) * shake * 2, (rand() - 0.5) * shake * 2);
  if (bg) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bg, 0, 0); ctx.restore(); }

  if (awakenT > 0) { ctx.fillStyle = rgba(255, 210, 80, (40 + 20 * Math.sin(globalT * 8)) / 255); ctx.fillRect(0, 0, vw, vh); }
  if (heroHurt > 0) line(0, groundY, vw, groundY, rgba(255, 40, 70, heroHurt / 0.6 * 0.8), 2.5 * u);

  ctx.fillStyle = "rgba(255,183,213,0.8)";
  for (const p of petals) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, PI2); ctx.fill();
    ctx.restore();
  }

  for (const e of enemies) drawEnemy(e);
  drawHero();

  for (const q of particles) {
    const k = q.life / q.maxLife;
    ctx.globalAlpha = clamp(k, 0, 1);
    circle(q.x, q.y, q.size * (0.5 + k), q.color);
  }
  ctx.globalAlpha = 1;

  drawTrail();

  for (const q of popups) {
    const age = q.maxLife - q.life;
    const pop = 1 + Math.max(0, 0.15 - age) * 4;
    txt(q.text, q.x, q.y, q.size * pop, q.color, "center", Math.min(1, q.life / 0.35));
  }
  ctx.restore();

  const sl = Math.max(speedT, awakenT > 0 ? 0.5 : 0);
  if (sl > 0) drawSpeedLines(Math.min(1, sl), awakenT > 0 ? "255,233,160" : "255,255,255");

  if (flashT > 0) {
    ctx.globalAlpha = Math.min(1, flashT / 0.4) * 0.67;
    ctx.fillStyle = flashColor; ctx.fillRect(0, 0, vw, vh);
    ctx.globalAlpha = 1;
  }

  if (state === S.TITLE) drawTitle();
  else if (state === S.PLAYING) drawHud();
  else drawGameOver();
}

function drawTrail() {
  if (trail.length < 2) return;
  const glow = awakenT > 0 ? "255,213,74" : "127,246,255";
  ctx.lineCap = "round";
  for (let i = 1; i < trail.length; i++) {
    const a = trail[i - 1], b = trail[i];
    const k = clamp(1 - b.age / 0.16, 0, 1);
    const w = (0.3 + 1.6 * (i / trail.length)) * u * k;
    line(a.x, a.y, b.x, b.y, `rgba(${glow},${0.43 * k})`, w * 3.2);
    line(a.x, a.y, b.x, b.y, `rgba(255,255,255,${k})`, w);
  }
}

function drawSpeedLines(intensity, rgb) {
  const cx = vw / 2, cy = vh / 2, r = Math.hypot(vw, vh) / 2;
  const rr = seeded(Math.floor(globalT * 24) + 1);
  for (let i = 0; i < 56; i++) {
    const ang = rr() * PI2, inner = r * (0.5 + rr() * 0.3);
    const w = (0.2 + rr() * 1.1) * u;
    line(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner, cx + Math.cos(ang) * r * 1.1, cy + Math.sin(ang) * r * 1.1,
      `rgba(${rgb},${intensity * 0.67 * rr()})`, w);
  }
}

// ---------- héros ----------
function drawHero() {
  const hx = vw / 2, f = vh * 0.95 + Math.sin(globalT * 2.2) * 0.3 * u;
  if (awakenT > 0) for (let k = 0; k < 3; k++)
    circle(hx, f - 8 * u, (9 + k * 3.5 + Math.sin(globalT * 10 + k) * 0.6) * u, rgba(255, 215, 80, (70 - k * 20) / 255));
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath(); ctx.ellipse(hx, f + 0.1 * u, 7 * u, 1.1 * u, 0, 0, PI2); ctx.fill();

  const sw = Math.sin(globalT * 5);
  ctx.fillStyle = "#E0283C"; ctx.beginPath();
  ctx.moveTo(hx - 1.5 * u, f - 11 * u);
  ctx.bezierCurveTo(hx - 6 * u, f - 12 * u + sw * u, hx - 9 * u, f - 9 * u - sw * 1.5 * u, hx - 13 * u, f - 10 * u + sw * 2 * u);
  ctx.lineTo(hx - 12.5 * u, f - 8.2 * u + sw * 2 * u);
  ctx.bezierCurveTo(hx - 9 * u, f - 7.5 * u - sw * u, hx - 5 * u, f - 10 * u, hx - u, f - 9.6 * u);
  ctx.closePath(); ctx.fill();

  const rim = awakenT > 0 ? "#FFD54A" : "#6B44A8";
  const body = [hx - 1.6 * u, f - 11 * u, hx - 4.2 * u, f - 9.5 * u, hx - 5.8 * u, f, hx + 5.8 * u, f, hx + 4.2 * u, f - 9.5 * u, hx + 1.6 * u, f - 11 * u];
  poly(body, heroHurt > 0 && Math.floor(globalT * 20) % 2 === 0 ? "#8A1020" : "#14121F");
  ctx.strokeStyle = rim; ctx.lineWidth = 0.35 * u; ctx.lineJoin = "round"; ctx.stroke();
  line(hx - 4.7 * u, f - 5.5 * u, hx + 4.7 * u, f - 5.5 * u, "#E0283C", 0.6 * u);

  line(hx - 4.5 * u, f - 3 * u, hx + 3.1 * u, f - 12.4 * u, "#2B0B12", 0.9 * u);
  line(hx + 3.3 * u, f - 12.7 * u, hx + 4.9 * u, f - 14.7 * u, "#E8E0D0", u);
  circle(hx + 3.15 * u, f - 12.5 * u, 0.75 * u, "#FFC94A");

  circle(hx, f - 13.2 * u, 2.6 * u, "#0B0A12");
  poly([hx - 2.6 * u, f - 12.4 * u, hx - 4.4 * u, f - 15.2 * u, hx - 1.7 * u, f - 14.9 * u, hx - 1.3 * u, f - 17.6 * u,
    hx + 0.4 * u, f - 15.5 * u, hx + 2.3 * u, f - 17.2 * u, hx + 2.0 * u, f - 14.9 * u, hx + 4.5 * u, f - 14.6 * u,
    hx + 2.6 * u, f - 12.4 * u], "#0B0A12");
  ctx.strokeStyle = rim; ctx.lineWidth = 0.3 * u; ctx.stroke();
  line(hx - 2.5 * u, f - 13.4 * u, hx + 2.5 * u, f - 13.4 * u, "#E0283C", 0.5 * u);
  line(hx - 2.4 * u, f - 13.4 * u, hx - 5 * u, f - 12.4 * u + sw * 0.8 * u, "#E0283C", 0.5 * u);
  line(hx - 2.4 * u, f - 13.4 * u, hx - 4.6 * u, f - 11.6 * u + sw * 0.6 * u, "#E0283C", 0.5 * u);
}

// ---------- yōkai ----------
function drawEnemy(e) {
  switch (e.kind) {
    case K.WISP: drawWisp(e.x, e.y, e.r, e.t + e.phase); break;
    case K.ONI: drawOni(e.x, e.y, e.r, "#D7263D", "#F3E9D2", e.hp < e.maxHp); break;
    case K.KITSUNE: drawKitsune(e.x, e.y, e.r, e.t + e.phase); break;
    case K.TALISMAN: drawTalisman(e.x, e.y, e.r, e.t + e.phase); break;
    case K.RAMEN: drawRamen(e.x, e.y, e.r, e.t); break;
    case K.BOSS: drawBoss(e); break;
  }
  if (e.flash > 0) circle(e.x, e.y, e.r, `rgba(255,255,255,${clamp(e.flash / 0.12 * 0.8, 0, 1)})`);
}

function drawWisp(x, y, r, t) {
  circle(x, y, r * 2, "rgba(111,232,255,0.13)");
  circle(x, y, r * 1.45, "rgba(111,232,255,0.27)");
  ctx.fillStyle = "#6FE8FF"; ctx.beginPath();
  ctx.moveTo(x - r, y);
  ctx.bezierCurveTo(x - r, y - r * 1.2, x - r * 0.2 + Math.sin(t * 8) * r * 0.3, y - r * 1.6, x + Math.sin(t * 6) * r * 0.5, y - r * 2.7);
  ctx.bezierCurveTo(x + r * 0.3, y - r * 1.5, x + r, y - r * 1.1, x + r, y);
  ctx.closePath(); ctx.fill();
  circle(x, y, r, "#6FE8FF");
  circle(x, y + r * 0.1, r * 0.6, "#E6FBFF");
  ctx.fillStyle = "#10203A";
  ctx.beginPath(); ctx.ellipse(x - r * 0.29, y + r * 0.09, r * 0.13, r * 0.21, 0, 0, PI2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + r * 0.29, y + r * 0.09, r * 0.13, r * 0.21, 0, 0, PI2); ctx.fill();
}

function drawOni(x, y, r, skin, horn, cracked) {
  poly([x - r * 0.7, y - r * 0.5, x - r * 0.25, y - r * 0.85, x - r * 0.8, y - r * 1.5], horn);
  poly([x + r * 0.7, y - r * 0.5, x + r * 0.25, y - r * 0.85, x + r * 0.8, y - r * 1.5], horn);
  circle(x, y, r, skin);
  circle(x, y + r * 0.25, r * 0.8, "rgba(0,0,0,0.2)");
  line(x - r * 0.62, y - r * 0.42, x - r * 0.12, y - r * 0.2, "#1A0508", r * 0.16);
  line(x + r * 0.62, y - r * 0.42, x + r * 0.12, y - r * 0.2, "#1A0508", r * 0.16);
  circle(x - r * 0.36, y - r * 0.05, r * 0.17, "#FFE14D");
  circle(x + r * 0.36, y - r * 0.05, r * 0.17, "#FFE14D");
  ctx.fillStyle = "#1A0508";
  ctx.fillRect(x - r * 0.39, y - r * 0.19, r * 0.06, r * 0.28);
  ctx.fillRect(x + r * 0.33, y - r * 0.19, r * 0.06, r * 0.28);
  roundRect(ctx, x - r * 0.5, y + r * 0.3, r, r * 0.32, r * 0.15); ctx.fill();
  poly([x - r * 0.4, y + r * 0.3, x - r * 0.25, y + r * 0.3, x - r * 0.32, y + r * 0.52], "#fff");
  poly([x + r * 0.4, y + r * 0.3, x + r * 0.25, y + r * 0.3, x + r * 0.32, y + r * 0.52], "#fff");
  if (cracked) {
    line(x + r * 0.1, y - r, x - r * 0.1, y - r * 0.5, "#1A0508", r * 0.07);
    line(x - r * 0.1, y - r * 0.5, x + r * 0.15, y - r * 0.2, "#1A0508", r * 0.07);
  }
}

function drawKitsune(x, y, r, t) {
  for (let k = 0; k < 3; k++)
    circle(x + Math.sin(t * 4 + k) * r * 0.2, y - r * 0.2, r * (1.9 - k * 0.3), rgba(255, 140 + k * 30, 40, 0.2));
  poly([x - r * 0.9, y - r * 1.3, x - r * 0.35, y - r * 0.6, x + r * 0.35, y - r * 0.6, x + r * 0.9, y - r * 1.3,
    x + r * 0.95, y - r * 0.1, x, y + r * 1.1, x - r * 0.95, y - r * 0.1], "#FFF6EC");
  poly([x - r * 0.8, y - r * 1.1, x - r * 0.45, y - r * 0.68, x - r * 0.8, y - r * 0.5], "#E0283C");
  poly([x + r * 0.8, y - r * 1.1, x + r * 0.45, y - r * 0.68, x + r * 0.8, y - r * 0.5], "#E0283C");
  line(x - r * 0.6, y - r * 0.05, x - r * 0.15, y + r * 0.12, "#E0283C", r * 0.12);
  line(x + r * 0.6, y - r * 0.05, x + r * 0.15, y + r * 0.12, "#E0283C", r * 0.12);
  line(x, y - r * 0.5, x, y - r * 0.2, "#E0283C", r * 0.12);
  circle(x, y + r * 0.85, r * 0.12, "#1A0508");
}

function drawTalisman(x, y, r, t) {
  circle(x, y, r * 1.9 + Math.sin(t * 6) * r * 0.15, "rgba(155,27,255,0.27)");
  circle(x, y, r * 2.5, "rgba(155,27,255,0.2)");
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 2) * 0.26);
  const w = r * 0.6, h = r * 1.15;
  ctx.fillStyle = "#F2E3C2"; ctx.fillRect(-w, -h, w * 2, h * 2);
  ctx.strokeStyle = "#B3122E"; ctx.lineWidth = r * 0.1; ctx.strokeRect(-w * 0.82, -h * 0.9, w * 1.64, h * 1.8);
  txt("呪", 0, r * 0.35, r, "#B3122E", "center", 1, false);
  ctx.restore();
}

function drawRamen(x, y, r, t) {
  circle(x, y, r * 1.9, "rgba(255,213,74,0.27)");
  for (let k = -1; k <= 1; k++) {
    const sx = x + k * r * 0.4;
    line(sx + Math.sin(t * 5 + k) * r * 0.15, y - r * 0.4, sx + Math.sin(t * 5 + k + 2) * r * 0.15, y - r * 1.2, "rgba(255,255,255,0.6)", r * 0.1);
  }
  ctx.fillStyle = "#E8A13A"; ctx.beginPath(); ctx.ellipse(x, y - r * 0.05, r, r * 0.25, 0, 0, PI2); ctx.fill();
  line(x - r * 0.7, y - r * 0.08, x - r * 0.1, y - r * 0.02, "#FFE89A", r * 0.08);
  line(x - r * 0.6, y + r * 0.06, x, y + r * 0.08, "#FFE89A", r * 0.08);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(x + r * 0.375, y - r * 0.06, r * 0.225, r * 0.16, 0, 0, PI2); ctx.fill();
  circle(x + r * 0.37, y - r * 0.06, r * 0.12, "#FFB020");
  ctx.fillStyle = "#C0392B"; ctx.beginPath(); ctx.moveTo(x - r, y);
  ctx.ellipse(x, y, r, r * 0.9, 0, Math.PI, 0, true); ctx.closePath(); ctx.fill();
  line(x - r * 0.8, y + r * 0.3, x + r * 0.8, y + r * 0.3, "#fff", r * 0.07);
}

function drawBoss(e) {
  const x = e.x, y = e.y, r = e.r;
  for (let k = 0; k < 4; k++) {
    ctx.strokeStyle = rgba(180, 60, 255, (70 - k * 15) / 255); ctx.lineWidth = 0.6 * u;
    ctx.beginPath(); ctx.arc(x, y, r * (1.25 + k * 0.18) + Math.sin(e.t * 3 + k) * u, 0, PI2); ctx.stroke();
  }
  circle(x, y, r * 1.3, "rgba(155,27,255,0.33)");
  poly([x - r * 0.15, y - r * 0.9, x + r * 0.15, y - r * 0.9, x, y - r * 1.6], "#FFC94A");
  drawOni(x, y, r, "#7A1FA2", "#FFC94A", e.hp < e.maxHp / 2);
  const a = clamp((150 + 100 * Math.sin(e.t * 6)) / 255, 0, 1);
  circle(x - r * 0.36, y - r * 0.05, r * 0.24, rgba(255, 60, 60, a));
  circle(x + r * 0.36, y - r * 0.05, r * 0.24, rgba(255, 60, 60, a));
}

// ---------- interface ----------
function drawHud() {
  const top = 10 * u + safeTop();
  txt("SCORE", 4 * u, top - 4 * u, 3 * u, "#B9A8FF", "left");
  txt(String(score), 4 * u, top + 3 * u, 7 * u, "#fff", "left");

  const slots = Math.max(3, lives);
  for (let i = 0; i < slots; i++) {
    const on = i < lives;
    txt("♥", vw - 5 * u - i * 6 * u, top + u, 6 * u, on ? "#FF3D6E" : "rgba(255,255,255,0.33)", "center", 1, on);
  }

  if (combo >= 2) {
    const mult = Math.min(1 + Math.floor(combo / 5), 10);
    const pulse = 1 + Math.max(0, comboTimer - 1.1) * 1.5;
    txt(`${combo} コンボ`, vw / 2, top + u, 6 * u * pulse, "#FF6FD8");
    txt(`x${mult}`, vw / 2, top + 6.5 * u, 4 * u, "#FFE14D");
  }

  const b = enemies.find(e => e.kind === K.BOSS);
  if (b) {
    const bw = 60 * u, bx = (vw - bw) / 2, by = top + 10 * u;
    txt("大鬼 · GRAND ONI", vw / 2, by - 1.2 * u, 3.4 * u, "#E6B8FF");
    ctx.fillStyle = "rgba(0,0,0,0.67)"; roundRect(ctx, bx, by, bw, 2 * u, u); ctx.fill();
    const w = bw * clamp(b.hp / b.maxHp, 0, 1);
    if (w > 0) { ctx.fillStyle = "#B45CFF"; roundRect(ctx, bx, by, w, 2 * u, u); ctx.fill(); }
  }

  const gx = 4 * u, gy = vh - 6 * u - safeBottom(), gw = 30 * u, full = gauge >= 100;
  txt("覚醒 ÉVEIL", gx, gy - 1.3 * u, 3 * u, full ? "#FFE14D" : "#B9A8FF", "left");
  ctx.fillStyle = "rgba(0,0,0,0.67)"; roundRect(ctx, gx, gy, gw, 2.2 * u, u); ctx.fill();
  if (gauge > 0) {
    ctx.fillStyle = full ? `rgb(255,${clamp(200 + 55 * Math.sin(globalT * 10), 0, 255) | 0},80)` : "#7FF6FF";
    roundRect(ctx, gx, gy, gw * gauge / 100, 2.2 * u, u); ctx.fill();
  }

  if (full) {
    const p = awakenBtn(), pul = 1 + Math.sin(globalT * 8) * 0.08;
    circle(p.x, p.y, 11 * u * pul, "rgba(255,213,74,0.4)");
    circle(p.x, p.y, 8.5 * u, "#FFD54A");
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 0.6 * u; ctx.beginPath(); ctx.arc(p.x, p.y, 8.5 * u, 0, PI2); ctx.stroke();
    txt("覚醒", p.x, p.y + 1.2 * u, 5.2 * u, "#3A0C1C", "center", 1, false);
    txt("TOUCHE !", p.x, p.y + 5 * u, 2.4 * u, "#3A0C1C", "center", 1, false);
  }
}

function drawTitle() {
  ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, vw, vh);
  const ty = vh * 0.2;
  txt("黒き航跡", vw / 2, ty - 10 * u, 7 * u, "#E0283C");
  txt("BLACKWAKE", vw / 2, ty + 3 * u + Math.sin(globalT * 2) * 0.6 * u, 14 * u, "#fff");
  txt("~ La Lame de l'Ombre ~", vw / 2, ty + 10 * u, 4.2 * u, "#FFB7D5");

  let ly = vh * 0.38;
  const ix = 13 * u, tx = 22 * u;
  const row = (text, icon) => { icon(ix, ly - 1.4 * u); txt(text, tx, ly, 3.4 * u, "#fff", "left"); ly += 9 * u; };
  row("Glisse le doigt pour trancher", (x, y) => drawWisp(x, y, 3 * u, globalT));
  row("Oni : 2 coups pour le vaincre", (x, y) => drawOni(x, y, 3.4 * u, "#D7263D", "#F3E9D2", false));
  row("Kitsune : il zigzague !", (x, y) => drawKitsune(x, y, 3 * u, globalT));
  row("NE TRANCHE PAS les talismans 呪", (x, y) => drawTalisman(x, y, 3 * u, globalT));
  row("Ramen = +1 vie", (x, y) => drawRamen(x, y, 3.2 * u, globalT));
  txt("Remplis la jauge puis active l'ÉVEIL 覚醒", vw / 2, ly, 3.4 * u, "#FFE14D");
  ly += 5.5 * u;
  txt("Protège la corde sacrée !", vw / 2, ly, 3.4 * u, "#FF6F91");

  txt(`RECORD : ${best}`, vw / 2, vh * 0.8 + 8 * u, 4 * u, "#B9A8FF");
  if (Math.floor(globalT * 2) % 2 === 0) txt("TOUCHE POUR COMMENCER", vw / 2, vh * 0.75, 5 * u, "#fff");
}

function rank(s) {
  if (s < 1000) return "Apprenti du Dojo";
  if (s < 3000) return "Rōnin";
  if (s < 6000) return "Samouraï";
  if (s < 10000) return "Maître Lame";
  if (s < 20000) return "Shōgun des Ombres";
  return "Légende Kami 神";
}

function drawGameOver() {
  const a = Math.min(1, stateT / 0.6);
  ctx.fillStyle = rgba(10, 0, 12, 0.7 * a); ctx.fillRect(0, 0, vw, vh);
  txt("敗北…", vw / 2, vh * 0.24, 12 * u, "#E0283C", "center", a);
  txt("GAME OVER", vw / 2, vh * 0.31, 10 * u, "#fff", "center", a);
  txt("SCORE", vw / 2, vh * 0.4, 4 * u, "#B9A8FF", "center", a);
  txt(String(score), vw / 2, vh * 0.4 + 10 * u, 11 * u, "#fff", "center", a);
  txt(`Combo max : ${maxCombo}   ·   Boss vaincus : ${bossesBeaten}`, vw / 2, vh * 0.52, 3.4 * u, "#FFB7D5", "center", a);
  txt(`Rang : ${rank(score)}`, vw / 2, vh * 0.58, 5 * u, "#FFE14D", "center", a);
  if (newRecord) txt("★ NOUVEAU RECORD ! ★", vw / 2, vh * 0.65, 5.5 * u * (1 + Math.sin(globalT * 6) * 0.06), "#FF6FD8", "center", a);
  else txt(`Record : ${best}`, vw / 2, vh * 0.65, 4 * u, "#B9A8FF", "center", a);
  if (stateT > 1.2 && Math.floor(globalT * 2) % 2 === 0) txt("TOUCHE POUR REJOUER", vw / 2, vh * 0.74, 5 * u, "#fff");
}

// marges de sécurité (encoche / barre d'accueil de l'iPhone)
let safeT = 0, safeB = 0;
function readSafe() {
  const probe = document.createElement("div");
  probe.style.cssText = "position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden";
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  safeT = parseFloat(cs.paddingTop) || 0; safeB = parseFloat(cs.paddingBottom) || 0;
  probe.remove();
}
function safeTop() { return safeT; }
function safeBottom() { return safeB; }

// ================= Boucle =================
function frame(ts) {
  const dt = lastTs ? clamp((ts - lastTs) / 1000, 0, 0.05) : 0.016;
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
window.addEventListener("resize", () => { readSafe(); resize(); });
document.addEventListener("visibilitychange", () => { lastTs = 0; });
readSafe();
resize();
requestAnimationFrame(frame);
})();
</script>
